name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Production build
        run: npx ng build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/frontend/browser/
          retention-days: 7

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: pantry-tracker-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the image and request pages
        run: |
          docker run -d --name web -p 8088:8088 -e PORT=8088 -e API_URL=https://example.com pantry-tracker-web:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8088/ > /dev/null && break; sleep 1; done
          curl -fsS http://localhost:8088/ | grep -q "<app-root>" && echo "index.html served"
          curl -fsS http://localhost:8088/sign-in | grep -q "<app-root>" && echo "client-side route served"
          curl -fsS -o /dev/null http://localhost:8088/ocr/worker.min.js && echo "receipt reader worker served"
          curl -fsS -o /dev/null http://localhost:8088/ocr/core/tesseract-core-simd-lstm.wasm.js && echo "receipt reader engine served"
          curl -fsS -o /dev/null http://localhost:8088/ocr/lang/eng.traineddata.gz && echo "receipt reader language data served"

      - name: Container log
        if: always()
        run: docker logs web || true

  deploy:
    name: Deploy to Render
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning title=Not deployed::Add the RENDER_DEPLOY_HOOK_URL repository secret (Render service > Settings > Deploy Hook) to deploy from CI."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render deploy started for ${GITHUB_SHA::7}"
